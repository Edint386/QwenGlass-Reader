# 80 端口只放行 ACME 校验，其余跳 https。签证书之前先单独装这一段（README 第 3 步）。
server {
    listen 80;
    server_name reader.example.com;
    server_tokens off;

    access_log off;
    error_log /www/sites/reader.example.com/log/error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
