# Agent 文字版的云端实例（deploy/cloud/README.md）。放在服务器 /opt/glassreader-text/，和页图版并存。
# 书库和进度都用页图版那份，两边接着读。只监听回环：公网入口是 OpenResty 上的 /text/（site.https.conf）。
name: glassreader-text

services:
  reader:
    build:
      context: ./app
    image: glassreader-text:local
    container_name: glassreader-text
    env_file:
      - ./.env
    environment:
      READER_HOST: 0.0.0.0
      READER_PORT: "8780"
      READER_BOOKS_DIR: /books
      READER_STATE_FILE: /data/progress.json
      TZ: UTC
    ports:
      - 127.0.0.1:19517:8780
    volumes:
      - /opt/glassreader/books:/books:ro
      - /opt/glassreader/data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8780/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
