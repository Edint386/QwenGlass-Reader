# glassreader（眼镜看小说）：挂在 https://cast.example.com/reader/ 下（草稿，未部署；reader/deploy/README.md）。
# 放在 /opt/1panel/apps/openresty/openresty/www/sites/cast.example.com/proxy/reader.conf，
# 与 glasscast 的 proxy/root.conf 并列；前提是站点主配置 include 了 proxy/*.conf（README 第 1 步先确认）。
#
# - 只转发 glassreader 的三类路径，其余 /reader/... 一律 404：
#     /reader/healthz         → /healthz（tunnel.sh 保温、人工检查）
#     /reader/r/<key>/...     → /r/<key>/...（眼镜经手机下载页图，只允许 GET / HEAD）
#     /reader/mcp             → /mcp（平台 MCP 插件，无状态协议，POST）
# - proxy_pass 带 URI 时 nginx 把匹配到的前缀换掉：/reader/r/… → /r/…，glassreader 不需要知道前缀；
#   它用 READER_PUBLIC_URL=https://cast.example.com/reader 生成页图地址。
# - 前缀匹配取最长：location ^~ /reader/ 比 root.conf 的 location ^~ / 长，glasscast 的路由不受影响。
# - 只有页图（/reader/r/）关访问日志：地址里有 key，不落盘（glassreader 自己的访问日志会把 key 打码）。
#   /reader/mcp、/reader/healthz 不含 key，照常记日志：排查平台超时（499 等）要看它。
# - 不写 add_header：location 里写了会覆盖站点级的安全头。不含任何 HTTP/3 设置。
# - proxy_next_upstream non_idempotent：池里的旧连接失败时 POST /mcp 也重发一次。open_book / list_books /
#   reading_status、按章节或百分比跳转重发无害；只有 jump(pages=N) 若第一次其实已经执行，会多翻 N 页（README 已注明）。

location = /reader/healthz {
    proxy_pass http://glassreader_tunnel/healthz;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
}

location ^~ /reader/r/ {
    limit_except GET {
        deny all;
    }
    proxy_pass http://glassreader_tunnel/r/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    gzip off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 4s;
    access_log off;
}

location = /reader/mcp {
    limit_except POST {
        deny all;
    }
    proxy_pass http://glassreader_tunnel/mcp;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    client_max_body_size 64k;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout non_idempotent;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 4s;
}

location ^~ /reader/ {
    return 404;
}
