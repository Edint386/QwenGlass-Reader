# glassreader（眼镜看小说）：到电脑反向 SSH 隧道的 upstream（草稿，未部署；reader/deploy/README.md）。
# 放在 /opt/1panel/apps/openresty/openresty/conf/conf.d/zz-glassreader-upstream.conf（容器内 conf.d 同名）。
# 照抄 glasscast 的 zz-glasscast-upstream.conf（glasscast/docs/deploy.md §9），只换名字和端口：
# - 服务器 127.0.0.1:18780 = reader/deploy/tunnel.sh 反向转发到电脑 127.0.0.1:8780（glassreader serve）。
# - keepalive：复用到 sshd 的连接（冷连接约 0.7 s，热连接约 0.25 s；平台工具超时 3 s）。
#   glassreader serve 的 uvicorn timeout_keep_alive=7200，比这里长，nginx 先关；tunnel.sh 每 30 s 经公网保温一次。
# - 同一地址写两个 peer + reader.conf 里的 proxy_next_upstream：隧道重连后池里的旧连接失效时立刻换新连接重发。
# - max_fails=0：隧道短暂断开时不要把 peer 标记为 down。
upstream glassreader_tunnel {
    server 127.0.0.1:18780 max_fails=0;
    server 127.0.0.1:18780 max_fails=0;
    keepalive 16;
    keepalive_timeout 3600s;
}
