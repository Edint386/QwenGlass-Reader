# 80 端口只放行 ACME 校验，其余跳 https。签证书之前先只装这一段。
server {
    listen 80;
    server_name reader.example.com;
    server_tokens off;

    access_log off;
    error_log /www/sites/reader.example.com/log/error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443 只转发 /healthz、/r/（手机下载页图，只允许 GET / HEAD）、/mcp（平台 MCP 插件，POST），其余 404。
# /r/ 的地址里有 key，不落盘：关访问日志，错误日志只留 crit（上游连不上、超时是 error 级别，日志行带完整请求）。
# 证书和日志的路径是 1Panel OpenResty 的写法，按你的服务器改。
upstream glassreader_cloud {
    server 127.0.0.1:19516 max_fails=0;
    keepalive 16;
    keepalive_timeout 3600s;
}

server {
    listen 443 ssl http2;
    server_name reader.example.com;
    server_tokens off;

    ssl_certificate /www/sites/reader.example.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/reader.example.com/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    access_log /www/sites/reader.example.com/log/access.log;
    error_log /www/sites/reader.example.com/log/error.log warn;

    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        proxy_pass http://glassreader_cloud;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location ^~ /r/ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://glassreader_cloud;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        gzip off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        access_log off;
        error_log /www/sites/reader.example.com/log/error.log crit;
    }

    location = /mcp {
        limit_except POST {
            deny all;
        }
        proxy_pass http://glassreader_cloud;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        client_max_body_size 64k;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
