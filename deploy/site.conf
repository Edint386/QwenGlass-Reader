# 80 端口只放行 ACME 校验，其余跳 https。签证书之前先只装这一段。
server {
    listen 80;
    server_name reader.example.com;
    server_tokens off;

    access_log off;
    error_log /www/sites/reader.example.com/log/error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443 只转发 /healthz、/agent（平台连进来的 WebSocket），其余 404。
# 证书和日志的路径是 1Panel OpenResty 的写法，按你的服务器改。
upstream glassreader_text {
    server 127.0.0.1:19517 max_fails=0;
    keepalive 16;
    keepalive_timeout 3600s;
}

server {
    listen 443 ssl http2;
    server_name reader.example.com;
    server_tokens off;

    ssl_certificate /www/sites/reader.example.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/reader.example.com/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    access_log /www/sites/reader.example.com/log/access.log;
    error_log /www/sites/reader.example.com/log/error.log warn;

    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        proxy_pass http://glassreader_text/healthz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Agent 文字版：平台主动连进来，长连接。Bearer 由程序校验，Upgrade 要转发
    location = /agent {
        proxy_pass http://glassreader_text/agent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location / {
        return 404;
    }
}
